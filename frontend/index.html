<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>InvestIA</title>
<style>
:root{--bg:#0b0f17;--card:#141b29;--tx:#e6ebf5;--mut:#8592a8;--up:#22c55e;--dn:#ef4444;--wn:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:16px;max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#222b3d}
.ON{color:var(--up)}.OFF{color:var(--dn)}.UPD{color:var(--wn)}
nav{display:flex;gap:6px;margin:14px 0;overflow-x:auto}
nav button{background:var(--card);color:var(--tx);border:0;padding:8px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:#2b5cff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border-radius:12px;padding:14px;transition:.2s}
.sym{font-weight:700}.name{color:var(--mut);font-size:12px}.price{font-size:22px;margin:8px 0}
.up{color:var(--up)}.dn{color:var(--dn)}.meta{color:var(--mut);font-size:11px;line-height:1.5}
.warn{color:var(--wn)}footer{margin:24px 0;color:var(--mut);font-size:12px}
</style></head><body>
<header><h2>InvestIA</h2><div><span id="conn" class="pill OFF">OFFLINE</span> <span id="last" class="pill">--:--:--</span></div></header>
<nav id="tabs"></nav><div class="grid" id="grid"><p class="meta">Aguardando dados reais dos provedores…</p></div>
<div id="prov" class="meta" style="margin-top:16px"></div>
<footer>Esta ferramenta possui finalidade educacional e informativa e não constitui recomendação financeira.
Os dados vêm de provedores públicos e podem ter atraso; o status de cada ativo é indicado no card.</footer>
<script>
const KINDS={all:"Todos",crypto:"Cripto",fii:"FIIs",stock:"Ações",currency:"Moedas"};
let quotes=[],kind="all",ws,retry=0;
const $=id=>document.getElementById(id);
$("tabs").innerHTML=Object.entries(KINDS).map(([k,v])=>`<button data-k="${k}" class="${k==kind?'on':''}">${v}</button>`).join("");
$("tabs").onclick=e=>{if(e.target.dataset.k){kind=e.target.dataset.k;[...$("tabs").children].forEach(b=>b.classList.toggle("on",b.dataset.k==kind));render()}};
const brl=n=>n==null?"—":n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const STATUS={delayed:["Dados com atraso","warn"],realtime:["Tempo real",""],error:["Erro ao atualizar","dn"],unavailable:["Dados indisponíveis","dn"]};
function render(){
  const list=quotes.filter(q=>kind=="all"||q.kind==kind);
  $("grid").innerHTML=list.length?list.map(q=>{const [t,c]=STATUS[q.status]||STATUS.unavailable,p=q.change_pct;
    return `<div class="card"><div class="sym">${q.symbol}</div><div class="name">${q.name}</div>
    <div class="price">${brl(q.price)}</div>
    <div class="${p>=0?'up':'dn'}">${p==null?'—':(p>=0?'+':'')+p.toFixed(2)+'%'} (${brl(q.change_abs)})</div>
    <div class="meta"><span class="${c}">${t}</span><br>Fonte: ${q.source}<br>Última atualização: ${new Date(q.timestamp*1000).toLocaleTimeString("pt-BR")}</div></div>`}).join(""):
    '<p class="meta">Dados indisponíveis no momento.</p>';
}
function setConn(s,t){$("conn").className="pill "+s;$("conn").textContent=t}
function connect(){
  const proto=location.protocol=="https:"?"wss":"ws";
  ws=new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen=()=>{retry=0;setConn("ON","ONLINE")};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type=="status")setConn("UPD","ATUALIZANDO");
    if(m.type=="snapshot"){quotes=m.quotes;setConn("ON","ONLINE");$("last").textContent=new Date().toLocaleTimeString("pt-BR");render();
      $("prov").innerHTML=Object.entries(m.providers).map(([n,s])=>`${n}: ${s.ok===null?'aguardando':s.ok?'ONLINE':'OFFLINE ('+s.error+')'}`).join(" · ")}};
  ws.onclose=()=>{setConn("OFF","OFFLINE");setTimeout(connect,Math.min(30000,1000*2**retry++))};
}
connect();
</script></body></html>
